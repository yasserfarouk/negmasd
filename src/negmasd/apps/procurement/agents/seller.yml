name: seller
port: 8002
negotiations:
  trade:
    name: trade
    partners:
      - name: buyer
        address: localhost
        port: 8001
      - name: seller
        address: localhost
        port: 8002
    mechanism: 
      type: negmas.sao.SAOMechanism
      n_steps: 200
      time_limit: 60
      outcome_space:
        type: negmas.outcomes.DiscreteCartesianOutcomeSpace
        issues:
          - name: price
            type: negmas.outcomes.CardinalIssue
            values: [100, 150, 200, 250, 300]
          - name: quantity
            type: negmas.outcomes.ContighousIssue
            values: [1, 10]
    negotiator:
      type: "negmas.sao.negotiators.BoulwareNegotiator"
    ufun:
      type: negmas.preferences.linear.LinearAggregationUtilityFunction
      weights: [0.00166667, 0.05]
      values:
        - type: negmas.preferences.fun.LinearFun
          slope: 1
        - type: negmas.preferences.fun.LinearFun
          slope: 1
      outcome_space:
        type: negmas.outcomes.DiscreteCartesianOutcomeSpace
        issues:
          - name: price
            type: negmas.outcomes.CardinalIssue
            values: [100, 150, 200, 250, 300]
          - name: quantity
            type: negmas.outcomes.ContighousIssue
            values: [1, 10]
      reserved_value: 0.1
