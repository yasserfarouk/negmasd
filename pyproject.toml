[project]
name = "negmasd"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yasser Mohammad", email = "yasserfarouk@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.12",
    "httpx>=0.28.1",
    "negmas>=0.11.3",
    "pydantic>=2.11.5",
    "pyyaml>=6.0.2",
    "requests>=2.32.3",
    "streamlit>=1.45.1",
    "typer>=0.16.0",
    "uvicorn>=0.34.3",
]

# gRPC is deliberately OPTIONAL: grpcio is a compiled wheel that fails to
# install on some Python builds. Nothing on the HTTP path imports it, so
# `uv sync` alone yields a fully working installation.
#   uv sync --extra grpc
[project.optional-dependencies]
grpc = ["grpcio>=1.60"]
mqtt = ["paho-mqtt>=2.0"]

[tool.uv.sources]
negmas = { path = "../negmas", editable = true }

[project.scripts]
negmasd = "negmasd:cli.app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.5",
    # Only needed to regenerate the checked-in protobuf stubs, never at runtime.
    "grpcio-tools>=1.60",
    # A pure-Python MQTT broker, so the MQTT tests can run against a real one
    # without requiring mosquitto. Test-only; never imported by negmasd.
    "amqtt>=0.11",
]

[tool.setuptools.package-data]
"*" = ["src/nemasd/apps/**/*", "src/nemasd/apps/**/*.yaml", "src/nemasd/apps/**/*.yml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that launch real subprocesses and communicate over HTTP",
    "grpc: tests that need the optional grpcio extra",
    "mqtt: tests that need the optional paho-mqtt extra and a broker",
]
